<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futuristic — cj-knob lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #04060c;
    --panel: rgba(18, 32, 54, .42);
    --edge: rgba(90, 200, 255, .18);
    --cyn: #35e6ff;
    --mag: #ff5ce1;
    --lim: #b6ff3d;
    --vio: #9b7bff;
    --ink: #dff2ff;
    --dim: #6d8ba8;
    --track: rgba(120, 190, 255, .1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: .75rem; display: flex; flex-direction: column; gap: .6rem;
    background-image:
      radial-gradient(900px 620px at 15% 0%, rgba(53,230,255,.10), transparent 62%),
      radial-gradient(900px 620px at 88% 100%, rgba(255,92,225,.09), transparent 62%),
      linear-gradient(rgba(90,200,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,200,255,.045) 1px, transparent 1px);
    background-size: auto, auto, 46px 46px, 46px 46px;
  }
  @media (min-width: 900px) and (min-height: 640px) {
    body { height: 100vh; overflow: hidden; }
    .row { min-height: 0; }
    .core { flex: 1.8; }
    .grid2 { flex: 1; }
    /* scoped to .side — the reactor rings carry their own sizes inline */
    .core .side cj-knob { --cj-size: min(128px, 16vh); }
    .grid2 cj-knob { --cj-size: min(112px, 14vh); }
  }

  h1 {
    margin: 0; font-size: 11px; letter-spacing: .34em; color: var(--cyn);
    text-transform: uppercase; text-shadow: 0 0 14px rgba(53,230,255,.55);
  }

  .hud {
    display: flex; flex-wrap: wrap; gap: 1.4rem; align-items: baseline;
    padding: .5rem .9rem; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 3px;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .hud b { color: var(--cyn); font-weight: 500; }
  .hud .t { color: var(--dim); }

  .row { display: grid; gap: .6rem; }
  .core { grid-template-columns: 1fr auto 1fr; align-items: center; }
  .grid2 { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }

  .cell {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    padding: .55rem .35rem .45rem; display: grid; justify-items: center; align-content: center;
    gap: .35rem; position: relative; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  /* HUD corner brackets */
  .cell::before, .cell::after {
    content: ''; position: absolute; width: 9px; height: 9px; pointer-events: none;
    border: 1px solid var(--cyn); opacity: .55;
  }
  .cell::before { top: 3px; left: 3px; border-right: 0; border-bottom: 0; }
  .cell::after { bottom: 3px; right: 3px; border-left: 0; border-top: 0; }

  .cap { font-size: 9.5px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }

  .side { display: grid; gap: .6rem; align-content: center; }

  /* the reactor: five thin rings stacked on one centre */
  .reactor { display: grid; place-items: center; position: relative; }
  .reactor > * { grid-area: 1 / 1; }
  .reactor-core {
    text-align: center; z-index: 2;
    text-shadow: 0 0 22px rgba(53,230,255,.7);
  }
  .reactor-core .n {
    font-size: clamp(30px, 5vh, 46px); font-weight: 600; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .reactor-core .u { font-size: 10px; letter-spacing: .28em; color: var(--dim); }

  @keyframes drift { to { rotate: 360deg; } }
  .drift-a { animation: drift 9s linear infinite; }
  .drift-b { animation: drift 14s linear infinite reverse; }

  cj-knob {
    --cj-track: var(--track);
    --cj-text: var(--ink);
    --cj-muted: var(--dim);
    --cj-tick: rgba(120,190,255,.3);
    --cj-duration: 260ms;
    --cj-easing: linear;
    --cj-size: 112px;
    --cj-thickness: 4;
  }
  /* the glow is the whole look: a coloured drop-shadow on the value arc alone */
  cj-knob::part(value)    { filter: drop-shadow(0 0 5px currentColor); }
  cj-knob::part(segments) { filter: drop-shadow(0 0 4px rgba(53,230,255,.5)); }
</style>
</head>
<body>

<h1>CJ-1013 · Reactor &amp; Systems Telemetry</h1>

<div class="hud">
  <span><span class="t">Node</span> <b>ORBITAL-7</b></span>
  <span><span class="t">Uptime</span> <b id="h-up">—</b></span>
  <span><span class="t">Output</span> <b id="h-out">—</b></span>
  <span><span class="t">Shield</span> <b id="h-shield">—</b></span>
  <span><span class="t">Warp</span> <b id="h-warp">—</b></span>
  <span><span class="t">Link</span> <b id="h-link">STABLE</b></span>
</div>

<div class="row core">
  <div class="side">
    <div class="cell">
      <cj-knob id="shield" min="0" max="100" value="86" sweep="270" readout="value"
               ticks="10" tick-major="5" color="var(--cyn)" label="shield"></cj-knob>
      <div class="cap">Deflector</div>
    </div>
    <div class="cell">
      <cj-knob id="warp" min="0" max="10" value="6.4" sweep="270" readout="value" decimals="1"
               ticks="10" tick-major="2" color="var(--mag)"
               zones="9-10:#ff5ce1" label="factor"></cj-knob>
      <div class="cap">Warp field</div>
    </div>
  </div>

  <div class="reactor">
    <cj-knob id="r1" readout="none" value="92" color="var(--cyn)"
             style="--cj-size:min(300px,38vh);--cj-thickness:2.6"></cj-knob>
    <cj-knob id="r2" readout="none" value="74" color="var(--mag)" class="drift-a"
             style="--cj-size:min(252px,32vh);--cj-thickness:2.6"></cj-knob>
    <cj-knob id="r3" readout="none" value="58" color="var(--vio)" class="drift-b"
             style="--cj-size:min(204px,26vh);--cj-thickness:2.6"></cj-knob>
    <cj-knob id="r4" readout="none" ticks="48" tick-major="4" value="0" color="transparent"
             style="--cj-size:min(160px,20vh);--cj-thickness:1;--cj-track:transparent"></cj-knob>
    <cj-knob id="r5" readout="none" value="41" color="var(--lim)"
             style="--cj-size:min(112px,14vh);--cj-thickness:3"></cj-knob>
    <div class="reactor-core">
      <div class="n" id="core-n">—</div>
      <div class="u">TERAWATT</div>
    </div>
  </div>

  <div class="side">
    <div class="cell">
      <cj-knob id="hull" min="0" max="100" value="97" sweep="270" readout="value"
               ticks="10" tick-major="5" color="var(--lim)"
               zones="0-30:#ff5ce1" label="integrity"></cj-knob>
      <div class="cap">Hull</div>
    </div>
    <div class="cell">
      <cj-knob id="life" readout="none" label="O₂ · H₂O · PWR"
               segments="38:#35e6ff, 33:#b6ff3d, 24:#9b7bff"></cj-knob>
      <div class="cap">Life support</div>
    </div>
  </div>
</div>

<div class="row grid2">
  <div class="cell">
    <cj-knob id="plasma" min="0" max="5000" value="3120" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--mag)" label="K"></cj-knob>
    <div class="cap">Plasma temp</div>
  </div>
  <div class="cell">
    <cj-knob id="antim" min="0" max="100" value="64" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--vio)" label="%"></cj-knob>
    <div class="cap">Antimatter</div>
  </div>
  <div class="cell">
    <cj-knob id="grav" min="0" max="2" value="1" sweep="240" start="150" readout="value" decimals="2"
             ticks="8" tick-major="4" color="var(--cyn)" benchmark="1" label="g"></cj-knob>
    <div class="cap">Gravity</div>
  </div>
  <div class="cell">
    <cj-knob id="inert" min="0" max="100" value="91" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--lim)" label="%"></cj-knob>
    <div class="cap">Inertial damp</div>
  </div>
  <div class="cell">
    <cj-knob id="sens" min="0" max="100" value="72" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--cyn)" label="%"></cj-knob>
    <div class="cap">Sensor array</div>
  </div>
  <div class="cell">
    <cj-knob id="comm" min="0" max="100" value="88" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--mag)" label="%"></cj-knob>
    <div class="cap">Subspace link</div>
  </div>
  <div class="cell">
    <cj-knob id="crew" readout="none" label="A · B · C"
             segments="44:#35e6ff, 31:#9b7bff, 19:#ff5ce1"></cj-knob>
    <div class="cap">Crew decks</div>
  </div>
  <div class="cell">
    <cj-knob id="heat" min="0" max="100" value="38" sweep="270" readout="value"
             ticks="10" tick-major="5" color="var(--lim)"
             zones="70-85:#ff5ce1, 85-100:#ff5ce1" label="%"></cj-knob>
    <div class="cap">Heat sink</div>
  </div>
</div>

<script type="module">
  import '../src/cj-knob.js';

  const $ = (id) => document.getElementById(id);
  const wave = (t, period, amp, phase = 0) => Math.sin(t / period + phase) * amp;
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;

    const out = 92 + wave(t, 6, 6);
    $('r1').value = out.toFixed(0);
    $('r2').value = (74 + wave(t, 8, 14, 1)).toFixed(0);
    $('r3').value = (58 + wave(t, 5, 18, 2)).toFixed(0);
    $('r5').value = (41 + wave(t, 3.5, 12, 3)).toFixed(0);
    $('core-n').textContent = (out * 1.34).toFixed(1);

    const shield = 86 + wave(t, 12, 9);
    const warp = 6.4 + wave(t, 15, 2.1);
    $('shield').value = shield.toFixed(0);
    $('warp').value = warp.toFixed(1);
    $('hull').value = (97 + wave(t, 41, 2)).toFixed(0);
    $('plasma').value = (3120 + wave(t, 7, 380)).toFixed(0);
    $('antim').value = (64 + wave(t, 23, 11)).toFixed(0);
    $('grav').value = (1 + wave(t, 19, 0.06)).toFixed(2);
    $('inert').value = (91 + wave(t, 13, 5)).toFixed(0);
    $('sens').value = (72 + wave(t, 9, 13)).toFixed(0);
    $('comm').value = (88 + wave(t, 11, 8)).toFixed(0);
    $('heat').value = (38 + warp * 3.4).toFixed(0);

    const up = Math.floor(t);
    $('h-up').textContent =
      `${String(Math.floor(up / 3600)).padStart(2, '0')}:${String(Math.floor(up / 60) % 60).padStart(2, '0')}:${String(up % 60).padStart(2, '0')}`;
    $('h-out').textContent = (out * 1.34).toFixed(1) + ' TW';
    $('h-shield').textContent = Math.round(shield) + ' %';
    $('h-warp').textContent = warp.toFixed(1);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>

</body>
</html>
